x-kafka-common: &kafka-common
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

services:
  kafka-data-permissions:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - chown 1000:1000 /kafka-1-data /kafka-2-data /kafka-3-data
    volumes:
      - kafka-1-data:/kafka-1-data
      - kafka-2-data:/kafka-2-data
      - kafka-3-data:/kafka-3-data
    restart: "no"

  kafka-1:
    image: apache/kafka:3.9.1
    container_name: ott-kafka-1
    restart: unless-stopped
    depends_on:
      kafka-data-permissions:
        condition: service_completed_successfully
    ports:
      - "9092:19092"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafka-1-data:/tmp/kraft-combined-logs
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:9092

  kafka-2:
    image: apache/kafka:3.9.1
    container_name: ott-kafka-2
    restart: unless-stopped
    depends_on:
      kafka-data-permissions:
        condition: service_completed_successfully
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafka-2-data:/tmp/kraft-combined-logs

  kafka-3:
    image: apache/kafka:3.9.1
    container_name: ott-kafka-3
    restart: unless-stopped
    depends_on:
      kafka-data-permissions:
        condition: service_completed_successfully
    ports:
      - "39092:39092"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:39092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafka-3-data:/tmp/kraft-combined-logs

  create-watch-events-topic:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka-1:9092
        --create
        --if-not-exists
        --topic watch_events_full
        --partitions 3
        --replication-factor 3
    restart: "no"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
